[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "chordatlas"
version = "0.1.0"
description = "CLI-first tools for building structured guitar chord charts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "ChordAtlas Maintainers" }
]
dependencies = [
  "PyYAML>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "jsonschema>=4.0",
  "pytest>=8.0"
]

[project.scripts]
chordchart = "chordatlas.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/chordatlas"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/LICENSE",
  "/README.md",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/schemas",
  "/src",
  "/tests"
]
