name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release distributions
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v6.3.0
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")

          tag_ref = f"refs/tags/{tag}"
          tag_type = subprocess.check_output(
              ["git", "cat-file", "-t", tag_ref],
              text=True,
          ).strip()
          if tag_type != "tag":
              raise SystemExit(f"Release tag {tag!r} must be annotated")

          tag_commit = subprocess.check_output(
              ["git", "rev-parse", f"{tag_ref}^{{}}"],
              text=True,
          ).strip()
          head_commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          if tag_commit != head_commit:
              raise SystemExit("Checked-out commit does not match the release tag target")

          subprocess.run(
              ["git", "merge-base", "--is-ancestor", tag_commit, "origin/main"],
              check=True,
          )
          PY

      - name: Build and check distributions
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build
          python -m twine check dist/*

      - name: Upload release distributions
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release distributions to PyPI
    if: ${{ !github.event.release.prerelease }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chordatlas
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release distributions
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-distributions
          path: dist/

      - name: Publish release distributions to PyPI
        # pypa/gh-action-pypi-publish v1.14.0
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
